name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # maturin develop needs an active virtualenv
      - run: python -m venv .venv && .venv/bin/pip install -q maturin pytest pandas pyarrow duckdb
      - run: $GITHUB_WORKSPACE/.venv/bin/maturin develop --release
        working-directory: python
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: .venv/bin/python -m pytest -q python/tests
      - name: Python oracle (independent CSV parser)
        run: .venv/bin/python -I scripts/oracle_test.py
