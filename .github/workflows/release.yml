name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest          # x86_64 manylinux (builds inside manylinux docker)
          - os: ubuntu-24.04-arm       # aarch64 manylinux
          - os: macos-latest           # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist --find-interpreter
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist

  macos-intel:
    name: Build wheel (macOS x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-intel
          path: python/dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [wheels, macos-intel, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # Configure a Trusted Publisher on PyPI first:
      # pypi.org → csvidx → Settings → Publishing → GitHub,
      # owner csvidx, repo csvidx, workflow release.yml, environment pypi.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
