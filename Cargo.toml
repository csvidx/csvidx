[package]
name = "csvidx"
version = "1.0.0"
edition = "2021"
description = "Secondary index for huge CSV files: lookup by key without importing"
license = "MIT"
repository = "https://github.com/csvidx/csvidx"
readme = "README.md"
keywords = ["csv", "index", "search", "data"]
categories = ["database-implementations", "command-line-utilities"]
exclude = ["static", "data*", "scripts", "results", "python", ".github", "run_all.sh", "requirements.txt"]

[workspace]
members = ["python"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
memchr = "2"
memmap2 = "0.9"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# rustc's default strip of debuginfo produces dylibs macOS 27 dyld rejects
# ("mis-aligned LINKEDIT string pool"); until rust >= 1.99, keep strip off.
strip = false
